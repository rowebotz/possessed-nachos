<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3d91" />
  <title>Presidents Quest</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/cheese.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles/theme.css" />
  <link rel="stylesheet" href="/styles/components.css" />
</head>
<body>
  <header class="app-header" role="banner">
    <div class="brand">
      <div class="brand-flag" aria-hidden="true"></div>
      <h1>Presidents Quest</h1>
    </div>
    <nav class="main-nav" role="navigation" aria-label="Main">
      <button class="nav-link" data-route="/dashboard" aria-current="page">Dashboard</button>
      <button class="nav-link" data-route="/flashcards">Flashcards</button>
      <button class="nav-link" data-route="/quiz">Quiz</button>
      <button class="nav-link" data-route="/guess">Guessing</button>
      <button class="nav-link" data-route="/mouse-and-cheese">Mouse & Cheese</button>
      <button class="nav-link" data-route="/library">Library</button>
      <button class="nav-link" data-route="/help">Help</button>
    </nav>
  </header>

  <main id="app" class="app-main" role="main">
    <!-- Views will be injected here -->
  </main>

  <div id="toaster" aria-live="polite" aria-atomic="true"></div>

  <footer class="app-footer" role="contentinfo">
    <p>Made with ♥ for learning U.S. Presidents. Daily streaks keep you motivated — come back tomorrow!</p>
  </footer>

  <script type="module" src="/scripts/app.js"></script>
</body>
</html>
